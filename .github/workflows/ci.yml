name: CI

on:
  push:
    # feature/**: pushed work branches are checked too (docs/decisions-pending.md #1).
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-only throwaway credentials for the service container (not secrets).
  DB_OWNER_PASSWORD: owner_ci_password
  DB_APP_PASSWORD: app_ci_password
  DB_PLATFORM_PASSWORD: platform_ci_password
  DB_INGEST_PASSWORD: ingest_ci_password
  # Same roles as local dev; tests run against jantrik_test.
  DATABASE_URL: postgresql://jantrik_app:app_ci_password@localhost:5432/jantrik_test
  # The API platform module's own role (tests point it at their database themselves).
  DATABASE_PLATFORM_URL: postgresql://jantrik_platform_app:platform_ci_password@localhost:5432/jantrik_test
  # The device receiver's own role (tests point it at their database themselves).
  DATABASE_INGEST_URL: postgresql://jantrik_ingest_app:ingest_ci_password@localhost:5432/jantrik_test
  DATABASE_MIGRATION_URL: postgresql://jantrik_owner:owner_ci_password@localhost:5432/jantrik_test
  DATABASE_URL_TEST: postgresql://jantrik_app:app_ci_password@localhost:5432/jantrik_test
  DATABASE_MIGRATION_URL_TEST: postgresql://jantrik_owner:owner_ci_password@localhost:5432/jantrik_test
  REDIS_URL: redis://localhost:6379
  REDIS_URL_TEST: redis://localhost:6379/1
  # Playwright end-to-end tests: seeded jantrik_e2e database, Redis DB 2.
  DATABASE_URL_E2E: postgresql://jantrik_app:app_ci_password@localhost:5432/jantrik_e2e
  DATABASE_MIGRATION_URL_E2E: postgresql://jantrik_owner:owner_ci_password@localhost:5432/jantrik_e2e
  REDIS_URL_E2E: redis://localhost:6379/2
  NEXT_PUBLIC_API_URL: http://localhost:4000
  # CI-only throwaway secrets (not used anywhere else).
  JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijkl
  OTP_PEPPER: ci-only-otp-pepper-0123456789abcdefghijklmno
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

# Two jobs in parallel: static checks + unit/API tests, and the Playwright suite (which builds
# the apps itself; building twice is cheaper than passing artifacts between jobs).
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    # Normal runs take well under 5 minutes; this only stops a hung job.
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same script Docker runs locally on first start: creates the roles (jantrik_owner,
      # jantrik_app, jantrik_platform_app, jantrik_ingest_app and the function owners) and the
      # jantrik, jantrik_test and jantrik_e2e databases.
      - name: Create database roles and databases
        run: sh docker/postgres/init/01-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres

      # Turbo tasks also depend on db:generate; this explicit step just makes a Prisma
      # failure show up as its own step.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      # Normally well under a minute; fail fast instead of eating the whole job timeout.
      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 5

      - name: Format check
        run: pnpm format:check

      - name: Apply migrations to the test database
        run: pnpm db:deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    # Normal runs take about 8 minutes (the exams specs about 2.5 of them).
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same script Docker runs locally on first start: creates the roles (jantrik_owner,
      # jantrik_app, jantrik_platform_app, jantrik_ingest_app and the function owners) and the
      # jantrik, jantrik_test and jantrik_e2e databases.
      - name: Create database roles and databases
        run: sh docker/postgres/init/01-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres

      # Turbo tasks also depend on db:generate; this explicit step just makes a Prisma
      # failure show up as its own step.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @jantrik/web exec playwright install --with-deps chromium

      # Starts the built API (outbox SMS provider) and web app against jantrik_e2e.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # The production database path (docs/deploy.md): the roles script on an empty cluster, the
  # migrations and templates as production applies them, then a backup restored into a scratch
  # database and compared with its source (deploy/backup/restore-check.sh).
  backup-restore:
    name: Production roles, backup and restore
    runs-on: ubuntu-24.04
    # Normally about 3 minutes.
    timeout-minutes: 15

    env:
      # The superuser of the service container: the scripts' admin login. The roles' passwords
      # and URLs are made for each run (first step).
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Fresh random passwords for this run only (as production makes them), instead of fixed
      # ones that would pass every check forever. They replace the workflow's CI passwords.
      - name: Throwaway passwords for this run
        run: |
          OWNER=$(openssl rand -hex 24)
          APP=$(openssl rand -hex 24)
          PLATFORM=$(openssl rand -hex 24)
          INGEST=$(openssl rand -hex 24)
          for pw in "$OWNER" "$APP" "$PLATFORM" "$INGEST"; do echo "::add-mask::$pw"; done
          url() { echo "postgresql://$1:$2@localhost:5432/jantrik"; }
          {
            echo "DB_OWNER_PASSWORD=$OWNER"
            echo "DB_APP_PASSWORD=$APP"
            echo "DB_PLATFORM_PASSWORD=$PLATFORM"
            echo "DB_INGEST_PASSWORD=$INGEST"
            echo "DATABASE_MIGRATION_URL=$(url jantrik_owner "$OWNER")"
            echo "DATABASE_URL=$(url jantrik_app "$APP")"
            echo "DATABASE_PLATFORM_URL=$(url jantrik_platform_app "$PLATFORM")"
            echo "DATABASE_INGEST_URL=$(url jantrik_ingest_app "$INGEST")"
          } >> "$GITHUB_ENV"

      - name: Check the passwords are this run's
        run: |
          for v in "$DB_OWNER_PASSWORD" "$DB_APP_PASSWORD" "$DB_PLATFORM_PASSWORD" "$DB_INGEST_PASSWORD"; do
            [ "${#v}" -eq 48 ] || { echo "a DB_*_PASSWORD is not this run's"; exit 1; }
          done
          case "$DATABASE_URL" in
            *"$DB_APP_PASSWORD"*) ;;
            *) echo "DATABASE_URL is not this run's"; exit 1 ;;
          esac

      # pg_dump must match the server (16): a newer one writes settings Postgres 16 refuses.
      - name: Postgres 16 client tools
        run: |
          if ! pg_dump --version | grep -q ' 16\.'; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client-16
            echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          fi

      - name: Check the client versions
        run: |
          for tool in psql pg_dump pg_restore; do
            "$tool" --version
            "$tool" --version | grep -q ' 16\.' || { echo "$tool is not version 16"; exit 1; }
          done

      - name: Lint the deploy scripts
        run: shellcheck deploy/compose.sh deploy/postgres/*.sh deploy/postgres/initdb/*.sh deploy/backup/*.sh

      - name: Check the production compose file
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.prod.example config --quiet

      - name: Create the roles and the production database (create-roles.sh)
        run: sh deploy/postgres/create-roles.sh

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build the db package
        run: pnpm --filter "@jantrik/db..." run build

      - name: Migrations and templates, as production applies them
        run: |
          pnpm db:deploy
          node packages/db/dist/cli/seed-templates.js

      # Demo institutes, so the copy has rows to compare and RLS to check.
      - name: Demo data
        run: pnpm db:seed

      - name: Back up, restore into a scratch database, compare
        run: sh deploy/backup/restore-check.sh jantrik
