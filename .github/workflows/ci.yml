name: CI

on:
  push:
    # feature/**: pushed work branches are checked too (docs/decisions-pending.md #1).
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

# A newer push to the same branch/PR cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI-only throwaway credentials for the service container (not secrets).
  DB_OWNER_PASSWORD: owner_ci_password
  DB_APP_PASSWORD: app_ci_password
  DB_PLATFORM_PASSWORD: platform_ci_password
  # Same roles as local dev; tests run against jantrik_test.
  DATABASE_URL: postgresql://jantrik_app:app_ci_password@localhost:5432/jantrik_test
  # The API platform module's own role (tests point it at their database themselves).
  DATABASE_PLATFORM_URL: postgresql://jantrik_platform_app:platform_ci_password@localhost:5432/jantrik_test
  DATABASE_MIGRATION_URL: postgresql://jantrik_owner:owner_ci_password@localhost:5432/jantrik_test
  DATABASE_URL_TEST: postgresql://jantrik_app:app_ci_password@localhost:5432/jantrik_test
  DATABASE_MIGRATION_URL_TEST: postgresql://jantrik_owner:owner_ci_password@localhost:5432/jantrik_test
  REDIS_URL: redis://localhost:6379
  REDIS_URL_TEST: redis://localhost:6379/1
  # Playwright end-to-end tests: seeded jantrik_e2e database, Redis DB 2.
  DATABASE_URL_E2E: postgresql://jantrik_app:app_ci_password@localhost:5432/jantrik_e2e
  DATABASE_MIGRATION_URL_E2E: postgresql://jantrik_owner:owner_ci_password@localhost:5432/jantrik_e2e
  REDIS_URL_E2E: redis://localhost:6379/2
  NEXT_PUBLIC_API_URL: http://localhost:4000
  # CI-only throwaway secrets (not used anywhere else).
  JWT_ACCESS_SECRET: ci-only-access-secret-0123456789abcdefghijkl
  OTP_PEPPER: ci-only-otp-pepper-0123456789abcdefghijklmno
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

# Two jobs in parallel: static checks + unit/API tests, and the Playwright suite (which builds
# the apps itself; building twice is cheaper than passing artifacts between jobs).
jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    # Normal runs take well under 5 minutes; this only stops a hung job.
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same script Docker runs locally on first start: creates the roles (jantrik_owner,
      # jantrik_app, jantrik_platform_app and the function owners) and the jantrik, jantrik_test
      # and jantrik_e2e databases.
      - name: Create database roles and databases
        run: sh docker/postgres/init/01-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres

      # Turbo tasks also depend on db:generate; this explicit step just makes a Prisma
      # failure show up as its own step.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      # Normally well under a minute; fail fast instead of eating the whole job timeout.
      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 5

      - name: Format check
        run: pnpm format:check

      - name: Apply migrations to the test database
        run: pnpm db:deploy

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    # Normal runs take about 5 minutes.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same script Docker runs locally on first start: creates the roles (jantrik_owner,
      # jantrik_app, jantrik_platform_app and the function owners) and the jantrik, jantrik_test
      # and jantrik_e2e databases.
      - name: Create database roles and databases
        run: sh docker/postgres/init/01-roles.sh
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres

      # Turbo tasks also depend on db:generate; this explicit step just makes a Prisma
      # failure show up as its own step.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm --filter @jantrik/web exec playwright install --with-deps chromium

      # Starts the built API (outbox SMS provider) and web app against jantrik_e2e.
      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
