packages:
  - apps/*
  - packages/*

# pnpm only runs dependency install scripts that are listed here as true.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true
  esbuild: true
  sharp: false
  '@swc/core': false
  '@parcel/watcher': false
  # Optional native accelerator for msgpackr (BullMQ); pure-JS fallback is fine.
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - next@16.4.2
